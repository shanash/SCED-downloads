name: Build

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build assets for (e.g., v1.19.13-korean-1)"
        required: true
        type: string

env:
  SCED_TAG: ${{ vars.SCED_TAG }}
  TTS_MOD_MANAGER_VERSION: ${{ vars.TTS_MOD_MANAGER_VERSION }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.14"
      - run: make init
      - run: make build
      - run: make minify
      - uses: softprops/action-gh-release@v3.0.0
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: |
            .build/*
            downloadable/**/*.json
            library.json
            modversion.json
          fail_on_unmatched_files: true
          generate_release_notes: true
